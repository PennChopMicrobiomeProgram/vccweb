{% extends "base.html" %}
{% block content %}
<style>
  .samples-controls {
    display: flex;
    flex-direction: column;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .column-toggle-panel {
    border: 1px solid #ddd;
    border-radius: 4px;
    padding: 1rem;
    max-height: 16rem;
    overflow: auto;
  }

  .column-toggle-panel h2 {
    font-size: 1rem;
    margin: 0 0 0.75rem;
  }

  .column-toggle-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 0.5rem 1rem;
  }

  .column-toggle-grid label {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.9rem;
    white-space: nowrap;
  }

  table.dataTable thead th,
  table.dataTable thead td {
    white-space: nowrap;
  }

  #samples-table {
    width: 100%;
  }

  #samples-table thead tr.filter-row th {
    padding: 4px 8px;
  }

  #samples-table thead tr.filter-row input {
    width: 100%;
    box-sizing: border-box;
    padding: 4px 6px;
    font-size: 0.85rem;
  }

  #samples-table th.sticky-column,
  #samples-table td.sticky-column {
    position: sticky;
    left: 0;
    background: #fff;
    z-index: 2;
  }

  #samples-table th.sticky-column {
    z-index: 4;
  }

  #samples-table_wrapper .dt-buttons {
    margin-bottom: 0.75rem;
  }
</style>

<table id="samples-table" class="display nowrap" cellspacing="0">
  <thead>
    <tr>
    {% for col in data.column_names %}<th>{{ col }}</th>{% endfor %}
    </tr>
  </thead>
  <tbody>
    {% for row in data.rows %}
    <tr>
      {% for val in row %}
      <td>{{ val }}</td>
      {% endfor %}
    </tr>
    {% endfor %}
  </tbody>
</table>

<script>
  $(document).ready(function() {
    new DataTable('#samples-table');
  });
</script>
{% endblock %}
